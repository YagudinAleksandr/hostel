services:
  postgres:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: hostel
      POSTGRES_USER: hostel
      POSTGRES_PASSWORD: hostel
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hostel -d hostel"]
      interval: 10s
      timeout: 5s
      retries: 10

  camunda:
    image: camunda/camunda-bpm-platform:7.22.0
    ports:
      - "8080:8080"

  # Локальный Keycloak в dev-режиме: встроенная H2, без TLS.
  # 8080 занят Camunda, поэтому наружу отдаём 8180.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    ports:
      - "8180:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    volumes:
      - ./keycloak/realm-hostel.json:/opt/keycloak/data/import/realm-hostel.json:ro

volumes:
  postgres-data:
