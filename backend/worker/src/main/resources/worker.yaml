server:
  port: 8610

spring:
  application:
    name: worker

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

camunda:
  bpm:
    client:
      base-url: http://localhost:8080/engine-rest
      async-response-timeout: 10000
      lock-duration: 10000

manager:
  url: http://localhost:8710
