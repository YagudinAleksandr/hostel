databaseChangeLog:
  - changeSet:
      id: 001-audit-event
      author: hostel
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: audit_event
      changes:
        - createTable:
            tableName: audit_event
            columns:
              - column: {name: id, type: BIGINT, autoIncrement: true, constraints: {primaryKey: true, nullable: false}}
              - column: {name: entity_type, type: VARCHAR(255), constraints: {nullable: false}}
              - column: {name: entity_id, type: VARCHAR(64)}
              - column: {name: action, type: VARCHAR(32), constraints: {nullable: false}}
              - column: {name: occurred_at, type: TIMESTAMP WITH TIME ZONE, constraints: {nullable: false}}

        - createIndex:
            tableName: audit_event
            indexName: ix_audit_event_entity
            columns:
              - column: {name: entity_type}
              - column: {name: entity_id}
