[versions]
spring-boot = "4.0.3"
spring-dependency-management = "1.1.7"
camunda = "7.24.0"
jackson = "2.20.2"
jakarta-annotation = "3.0.0"
jakarta-validation = "3.1.1"
junit-jupiter = "6.0.3"

[libraries]
# --- common ---
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
jackson-datatype-jsr310 = { module = "com.fasterxml.jackson.datatype:jackson-datatype-jsr310", version.ref = "jackson" }
jakarta-annotation-api = { module = "jakarta.annotation:jakarta.annotation-api", version.ref = "jakarta-annotation" }
jakarta-validation-api = { module = "jakarta.validation:jakarta.validation-api", version.ref = "jakarta-validation" }

# --- camunda ---
camunda-engine-rest-client = { module = "org.camunda.community:camunda-engine-rest-client-openapi-java", version.ref = "camunda" }
camunda-external-task-client-spring-boot = { module = "org.camunda.bpm.springboot:camunda-bpm-spring-boot-starter-external-task-client", version.ref = "camunda" }

# --- spring boot (версии управляются BOM-ом Boot) ---
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-starter-websocket = { module = "org.springframework.boot:spring-boot-starter-websocket" }
spring-boot-starter-graphql = { module = "org.springframework.boot:spring-boot-starter-graphql" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
liquibase-core = { module = "org.liquibase:liquibase-core" }
spring-boot-liquibase = { module = "org.springframework.boot:spring-boot-liquibase" }
lombok = { module = "org.projectlombok:lombok" }
postgresql = { module = "org.postgresql:postgresql" }
h2 = { module = "com.h2database:h2" }

# --- test ---
spring-graphql-test = { module = "org.springframework.graphql:spring-graphql-test" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "spring-dependency-management" }
