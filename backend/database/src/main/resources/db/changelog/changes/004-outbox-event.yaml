databaseChangeLog:
  - property:
      name: text.type
      value: TEXT
      dbms: postgresql
  - property:
      name: text.type
      value: VARCHAR(32600)
      dbms: h2

  - changeSet:
      id: 005-outbox-event
      author: hostel
      comment: Таблица исходящих событий (паттерн Transactional Outbox)
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: outbox_event
      changes:
        - createTable:
            tableName: outbox_event
            remarks: Исходящее событие, ожидающее отправки
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_outbox_event
                    nullable: false
              - column:
                  name: event_type
                  type: VARCHAR(32)
                  remarks: Тип события, uz.backend.common.enums.EventType
                  constraints:
                    nullable: false
              - column:
                  name: event_entity
                  type: VARCHAR(255)
                  remarks: Имя сущности, породившей событие
              - column:
                  name: aggregated_id
                  type: UUID
                  remarks: Идентификатор агрегата
              - column:
                  name: payload
                  type: ${text.type}
                  remarks: Тело события
                  constraints:
                    nullable: false
              - column:
                  name: send_attempts
                  type: INT
                  remarks: Число выполненных попыток отправки
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: last_error
                  type: ${text.type}
                  remarks: Текст последней ошибки отправки
              - column:
                  name: status
                  type: VARCHAR(32)
                  remarks: Состояние отправки, uz.backend.common.enums.DLQStatusType
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: last_attempt
                  type: TIMESTAMP WITH TIME ZONE
                  remarks: Время последней попытки отправки

        - createIndex:
            tableName: outbox_event
            indexName: ix_outbox_event_dispatch
            remarks: Выборка готовых к отправке событий
            columns:
              - column:
                  name: status
              - column:
                  name: send_attempts

        - createIndex:
            tableName: outbox_event
            indexName: ix_outbox_event_created_at
            remarks: Очистка отправленных событий по возрасту
            columns:
              - column:
                  name: created_at
