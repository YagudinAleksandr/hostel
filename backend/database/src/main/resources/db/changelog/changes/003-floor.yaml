databaseChangeLog:
  - changeSet:
      id: 004-floor
      author: hostel
      comment: Этаж — лист агрегата «Общежитие»
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: floor
      changes:
        - createTable:
            tableName: floor
            remarks: Этаж подъезда
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_floor
                    nullable: false
              - column:
                  name: entrance_id
                  type: BIGINT
                  remarks: Подъезд, которому принадлежит этаж
                  constraints:
                    nullable: false
              - column:
                  name: number
                  type: INT
                  remarks: Номер этажа, уникален в пределах подъезда
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            constraintName: fk_floor_entrance
            baseTableName: floor
            baseColumnNames: entrance_id
            referencedTableName: entrance
            referencedColumnNames: id
            onDelete: CASCADE

        - addUniqueConstraint:
            tableName: floor
            columnNames: entrance_id, number
            constraintName: ux_floor_entrance_number
