databaseChangeLog:
  - changeSet:
      id: 006-processed-event
      author: hostel
      comment: Журнал обработанных событий для идемпотентности потребителей
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: processed_event
      changes:
        - createTable:
            tableName: processed_event
            remarks: Отметка о том, что потребитель уже обработал событие
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_processed_event
                    nullable: false
              - column:
                  name: event_id
                  type: UUID
                  remarks: Идентификатор события из outbox_event
                  constraints:
                    nullable: false
              - column:
                  name: consumer_name
                  type: VARCHAR(255)
                  remarks: Имя потребителя
                  constraints:
                    nullable: false
              - column:
                  name: processed_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

        - addUniqueConstraint:
            tableName: processed_event
            columnNames: event_id, consumer_name
            constraintName: ux_processed_event_consumer

        - createIndex:
            tableName: processed_event
            indexName: ix_processed_event_processed_at
            remarks: Очистка журнала по возрасту
            columns:
              - column:
                  name: processed_at
